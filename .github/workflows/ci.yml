name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[approach]

      - name: Compile-check all .py files
        run: python -m compileall -q helpers

      - name: Helper --help smoke
        shell: bash
        run: |
          set -e
          for f in helpers/transcribe.py helpers/transcribe_batch.py \
                   helpers/pack_transcripts.py helpers/timeline_view.py \
                   helpers/analyze_audio.py helpers/detect_approach.py \
                   helpers/sparkle_overlay.py helpers/render.py \
                   helpers/grade.py; do
            echo "::group::$f --help"
            python "$f" --help
            echo "::endgroup::"
          done

      - name: ffmpeg / ffprobe present
        run: |
          ffmpeg -version
          ffprobe -version
